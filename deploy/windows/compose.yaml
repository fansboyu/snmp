services:
  postgres:
    image: netlooker/postgres:${IMAGE_VERSION:?Run install.ps1 first}
    environment:
      POSTGRES_DB: snmp_monitor
      POSTGRES_USER: snmp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run install.ps1 first}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U snmp -d snmp_monitor
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - snmp-monitor-net
    pull_policy: never
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    platform: linux/amd64
  api-gateway:
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://snmp:${POSTGRES_PASSWORD:?Run install.ps1 first}@postgres:5432/snmp_monitor?sslmode=disable
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:15173}
      JWT_SECRET: ${JWT_SECRET:?Run install.ps1 first}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run install.ps1 first}
      ALERT_EMAIL_ENABLED: ${ALERT_EMAIL_ENABLED:-false}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      ALERT_EMAIL_SEND_RESOLVED: ${ALERT_EMAIL_SEND_RESOLVED:-true}
      ALERT_EMAIL_SUBJECT_PREFIX: ${ALERT_EMAIL_SUBJECT_PREFIX:-[SNMP Monitor]}
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
    - snmp-monitor-net
    image: netlooker/api-gateway:${IMAGE_VERSION:?Run install.ps1 first}
    pull_policy: never
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    platform: linux/amd64
  migrator:
    command:
    - node
    - src/migrate.js
    restart: 'no'
    environment:
      DATABASE_URL: postgres://snmp:${POSTGRES_PASSWORD:?Run install.ps1 first}@postgres:5432/snmp_monitor?sslmode=disable
      MIGRATION_BASELINE_SQL: /app/schema.sql
      MIGRATIONS_DIR: /app/migrations
    volumes:
    - ./postgres/schema.sql:/app/schema.sql:ro
    - ./postgres/migrations:/app/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - snmp-monitor-net
    image: netlooker/migrator:${IMAGE_VERSION:?Run install.ps1 first}
    pull_policy: never
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    platform: linux/amd64
  collector-go:
    environment:
      DATABASE_URL: postgres://snmp:${POSTGRES_PASSWORD:?Run install.ps1 first}@postgres:5432/snmp_monitor?sslmode=disable
      COLLECT_INTERVAL_SECONDS: ${COLLECT_INTERVAL_SECONDS:-60}
      DEVICE_COLLECT_TIMEOUT_SECONDS: ${DEVICE_COLLECT_TIMEOUT_SECONDS:-45}
      NEIGHBOR_INTERVAL_SECONDS: ${NEIGHBOR_INTERVAL_SECONDS:-600}
      NEIGHBOR_TIMEOUT_SECONDS: ${NEIGHBOR_TIMEOUT_SECONDS:-15}
      DEVICE_REFRESH_SECONDS: ${DEVICE_REFRESH_SECONDS:-5}
      DATABASE_TIMEOUT_SECONDS: ${DATABASE_TIMEOUT_SECONDS:-10}
      MAINTENANCE_TIMEOUT_SECONDS: ${MAINTENANCE_TIMEOUT_SECONDS:-120}
      CLEANUP_INTERVAL_SECONDS: 3600
      METRIC_SAMPLE_RETENTION_DAYS: 30
      INTERFACE_SAMPLE_RETENTION_DAYS: ${INTERFACE_SAMPLE_RETENTION_DAYS:-15}
      ROLLUP_SAMPLE_RETENTION_DAYS: ${ROLLUP_SAMPLE_RETENTION_DAYS:-365}
      RESOLVED_ALERT_RETENTION_DAYS: 90
      ALERT_NOTIFICATION_RETENTION_DAYS: 90
      DISCOVERY_HISTORY_RETENTION_DAYS: 30
      CLEANUP_BATCH_SIZE: 5000
      ROLLUP_ENABLED: ${ROLLUP_ENABLED:-true}
      ROLLUP_INTERVAL_SECONDS: ${ROLLUP_INTERVAL_SECONDS:-300}
      ROLLUP_BUCKET_SECONDS: ${ROLLUP_BUCKET_SECONDS:-300}
      ROLLUP_LOOKBACK_SECONDS: ${ROLLUP_LOOKBACK_SECONDS:-900}
      SNMP_TIMEOUT_SECONDS: 3
      SNMP_RETRIES: 1
      WORKER_COUNT: ${WORKER_COUNT:-16}
      GETBULK_MAX_REPETITIONS: 25
      STORAGE_GUARD_PATH: /postgres-data
      STORAGE_GUARD_WARNING_USED_PERCENT: ${STORAGE_GUARD_WARNING_USED_PERCENT:-85}
      STORAGE_GUARD_READONLY_USED_PERCENT: ${STORAGE_GUARD_READONLY_USED_PERCENT:-90}
      STORAGE_GUARD_CLEANUP_USED_PERCENT: ${STORAGE_GUARD_CLEANUP_USED_PERCENT:-90}
      STORAGE_GUARD_RECOVERY_USED_PERCENT: ${STORAGE_GUARD_RECOVERY_USED_PERCENT:-85}
      STORAGE_GUARD_CLEANUP_COOLDOWN_SECONDS: ${STORAGE_GUARD_CLEANUP_COOLDOWN_SECONDS:-600}
      EMERGENCY_METRIC_SAMPLE_RETENTION_DAYS: ${EMERGENCY_METRIC_SAMPLE_RETENTION_DAYS:-7}
      EMERGENCY_INTERFACE_SAMPLE_RETENTION_DAYS: ${EMERGENCY_INTERFACE_SAMPLE_RETENTION_DAYS:-7}
      EMERGENCY_ROLLUP_SAMPLE_RETENTION_DAYS: ${EMERGENCY_ROLLUP_SAMPLE_RETENTION_DAYS:-90}
      EMERGENCY_RESOLVED_ALERT_RETENTION_DAYS: ${EMERGENCY_RESOLVED_ALERT_RETENTION_DAYS:-30}
      EMERGENCY_ALERT_NOTIFICATION_RETENTION_DAYS: ${EMERGENCY_ALERT_NOTIFICATION_RETENTION_DAYS:-30}
      EMERGENCY_DISCOVERY_HISTORY_RETENTION_DAYS: ${EMERGENCY_DISCOVERY_HISTORY_RETENTION_DAYS:-7}
      EMERGENCY_CLEANUP_BATCH_SIZE: ${EMERGENCY_CLEANUP_BATCH_SIZE:-10000}
      ALERT_EMAIL_ENABLED: ${ALERT_EMAIL_ENABLED:-false}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_SEND_RESOLVED: ${ALERT_EMAIL_SEND_RESOLVED:-true}
      ALERT_EMAIL_SUBJECT_PREFIX: ${ALERT_EMAIL_SUBJECT_PREFIX:-[SNMP Monitor]}
    volumes:
    - postgres-data:/postgres-data:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
    - snmp-monitor-net
    image: netlooker/collector-go:${IMAGE_VERSION:?Run install.ps1 first}
    pull_policy: never
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    platform: linux/amd64
  discovery-worker:
    environment:
      DATABASE_URL: postgres://snmp:${POSTGRES_PASSWORD:?Run install.ps1 first}@postgres:5432/snmp_monitor?sslmode=disable
      DISCOVERY_POLL_INTERVAL_SECONDS: 5
      DISCOVERY_STALE_RUNNING_SECONDS: 1800
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
    - snmp-monitor-net
    image: netlooker/discovery-worker:${IMAGE_VERSION:?Run install.ps1 first}
    pull_policy: never
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    platform: linux/amd64
  notifier:
    environment:
      JWT_SECRET: ${JWT_SECRET:?Run install.ps1 first}
      DATABASE_URL: postgres://snmp:${POSTGRES_PASSWORD:?Run install.ps1 first}@postgres:5432/snmp_monitor?sslmode=disable
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      SMTP_POLL_INTERVAL_SECONDS: ${SMTP_POLL_INTERVAL_SECONDS:-10}
      SMTP_BATCH_SIZE: ${SMTP_BATCH_SIZE:-50}
      SMTP_MAX_RETRIES: ${SMTP_MAX_RETRIES:-3}
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
    - snmp-monitor-net
    image: netlooker/notifier:${IMAGE_VERSION:?Run install.ps1 first}
    pull_policy: never
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    platform: linux/amd64
  web-vue3:
    ports:
    - ${HOST_BIND:-0.0.0.0}:${WEB_PORT:-15173}:80
    depends_on:
    - api-gateway
    networks:
    - snmp-monitor-net
    image: netlooker/web-vue3:${IMAGE_VERSION:?Run install.ps1 first}
    pull_policy: never
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    platform: linux/amd64
volumes:
  postgres-data: null
networks:
  snmp-monitor-net:
    driver: bridge
name: ${COMPOSE_PROJECT_NAME:-netlooker}
