name: Build offline release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        default: v1.6.2

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Build clean tagged source and export offline package
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected a semantic version tag.' }
          $version = $env:RELEASE_TAG.Substring(1)
          docker pull postgres:18-alpine
          if ($LASTEXITCODE -ne 0) { throw 'Database image pull failed.' }
          ./deploy/build-release.ps1 -ReleaseVersion $version
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }
      - name: Smoke-test exported images
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $folder = "releases/netlooker-$version-windows-amd64"
          & "$folder/install.ps1" -SkipImageLoad
          $configPath = "$folder/.env"
          $config = [IO.File]::ReadAllText($configPath).Replace('COMPOSE_PROJECT_NAME=netlooker', 'COMPOSE_PROJECT_NAME=netlooker-release-smoke').Replace('15173', '25176').Replace('HOST_BIND=0.0.0.0', 'HOST_BIND=127.0.0.1')
          [IO.File]::WriteAllText($configPath, $config)
          try {
            & "$folder/start.ps1"
            docker exec netlooker-release-smoke-api-gateway-1 node --input-type=module -e 'process.env.TEST_DATABASE_URL=process.env.DATABASE_URL; await import("./src/device-health.test.js")'
            if ($LASTEXITCODE -ne 0) { throw 'Device status integration test failed.' }
            docker exec netlooker-release-smoke-collector-go-1 ping -n -c 1 -W 1 -- 127.0.0.1
            if ($LASTEXITCODE -ne 0) { throw 'Non-root ICMP probe failed.' }
          } finally {
            docker compose --project-directory $folder --env-file $configPath -p netlooker-release-smoke -f "$folder/compose.yaml" down
          }
      - name: Verify archive and publish attachments
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $folder = "releases/netlooker-$version-windows-amd64"
          $manifest = Get-Content "$folder/VERSION.json" -Raw | ConvertFrom-Json
          if ($manifest.includesWorkingTreeChanges) { throw 'Release source must be clean.' }
          foreach ($entry in $manifest.files) {
            if ((Get-FileHash "$folder/$($entry.path)" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.sha256) { throw "Checksum failed: $($entry.path)" }
          }
          gh release upload $env:RELEASE_TAG "$folder.zip" "$folder.zip.sha256" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Attachment upload failed.' }
